<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Game for 5th Grade</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game-container">
        
        
        <!-- Login/Auth Screen -->
        <div id="auth-screen" class="screen">
            <h1>Login to Play</h1>
            <p style="margin-bottom:20px; font-size:1.2rem;">Create an account or login below.</p>
            <div class="settings-group">
                <input type="text" id="username-input" class="chalk-input" placeholder="Your Name" />
            </div>
            <div class="settings-group">
                <input type="password" id="password-input" class="chalk-input" placeholder="Password" />
            </div>
            <p id="auth-error" style="color:#ff6b6b; min-height: 24px; margin-bottom: 15px;"></p>
            <button id="login-btn" class="chalk-button">Login / Signup</button>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="screen hidden">
            <h1>Math Challenge</h1>
            <img src="assets/mascot.png" alt="Math Owl Mascot" id="mascot">
            <p>Welcome, 5th Grader!</p>
            
            <div class="options-container">
                <div class="option-group">
                    <label>Mode:</label>
                    <select id="mode-select" class="chalk-select">
                        <option value="survival">Survival (3 Lives)</option>
                        <option value="time">Time Attack (60s)</option>
                    </select>
                </div>
                <div class="option-group">
                    <label>Difficulty:</label>
                    <select id="diff-select" class="chalk-select">
                        <option value="easy">Easy</option>
                        <option value="medium" selected>Medium</option>
                        <option value="hard">Hard</option>
                    </select>
                </div>
                <div class="option-group">
                    <label>Category:</label>
                    <select id="cat-select" class="chalk-select">
                        <option value="mixed">Mixed</option>
                        <option value="bodmas">BODMAS Only</option>
                        <option value="fractions">Fractions Only</option>
                    </select>
                </div>
            </div>

            <div class="start-actions">
                <button id="start-btn" class="chalk-button">Start Game</button>
                <button id="stats-btn" class="chalk-button">View Stats</button>
            </div>
        </div>

        <!-- Stats Screen -->
        <div id="stats-screen" class="screen hidden">
            <h1>Your Progress</h1>
            <img src="assets/mascot.png" alt="Math Owl Mascot" id="mascot-stats" style="max-width:100px; margin-bottom:10px;">
            <div class="stats-board">
                <p>Total Answered: <span id="stat-total">0</span></p>
                <p>Total Correct: <span id="stat-correct">0</span></p>
                <p>Accuracy: <span id="stat-accuracy">0%</span></p>
                <p>Highest Streak: <span id="stat-streak">0</span></p>
            </div>
            <button id="back-to-menu-btn" class="chalk-button">Back to Menu</button>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen hidden">
            
            <div id="stats-bar">
                <span id="score-display">Score: 0 <span id="combo-display" class="hidden"></span></span>
                <span id="high-score-display">High Score: 0</span>
                <span id="lives-display">Lives: ❤️❤️❤️</span>
            </div>

            
            <div id="problem-container">
                <h2 id="question">Loading question...</h2>
            </div>
            
            
            <div id="answer-container">
                <!-- Numpad Input Display -->
                <div id="numpad-display-container" class="hidden">
                    <div id="numpad-display"></div>
                </div>

                <!-- MCQ Buttons Container -->
                <div id="mcq-container" class="hidden">
                    <button class="mcq-btn chalk-button"></button>
                    <button class="mcq-btn chalk-button"></button>
                    <button class="mcq-btn chalk-button"></button>
                    <button class="mcq-btn chalk-button"></button>
                </div>

                <!-- On-Screen Numpad -->
                <div id="numpad-container" class="hidden">
                    <div class="numpad-row">
                        <button class="numpad-btn chalk-button">1</button>
                        <button class="numpad-btn chalk-button">2</button>
                        <button class="numpad-btn chalk-button">3</button>
                    </div>
                    <div class="numpad-row">
                        <button class="numpad-btn chalk-button">4</button>
                        <button class="numpad-btn chalk-button">5</button>
                        <button class="numpad-btn chalk-button">6</button>
                    </div>
                    <div class="numpad-row">
                        <button class="numpad-btn chalk-button">7</button>
                        <button class="numpad-btn chalk-button">8</button>
                        <button class="numpad-btn chalk-button">9</button>
                    </div>
                    <div class="numpad-row">
                        <button class="numpad-btn chalk-button">-</button>
                        <button class="numpad-btn chalk-button">0</button>
                        <button class="numpad-btn chalk-button">/</button>
                    </div>
                    <div class="numpad-row action-row">
                        <button id="numpad-backspace" class="numpad-btn chalk-button action-btn">⌫</button>
                        <button id="numpad-submit" class="numpad-btn chalk-button action-btn">Submit</button>
                    </div>
                </div>
            </div>

            
            <p id="feedback-message"></p>
            <button id="next-question-btn" class="chalk-button hidden">Next Question</button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="screen hidden">
            <h1>Game Over!</h1>
            <p id="final-score">Your Score: 0</p>
            <p id="new-high-score-msg" class="hidden">🎉 New High Score! 🎉</p>
            <button id="restart-btn" class="chalk-button">Play Again</button>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="game.js"></script>
</body>
</html>
